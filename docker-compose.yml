services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: spectral-packer-dev:local
    working_dir: /workspace
    volumes:
      - .:/workspace
      - pip-cache:/root/.cache/pip
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    stdin_open: true
    tty: true
    shm_size: "8gb"
    command: bash

volumes:
  pip-cache:
